name: clang-format check
on: [push, pull_request]
jobs:
  format-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format-14
      - name: Check format
        run: |
          # Siv3Dプロジェクトのソースファイルのみを対象とする
          find siv3d_bullet -type f \( -name '*.cpp' -o -name '*.h' -o -name '*.hpp' \) \
            ! -path "*/Intermediate/*" \
            ! -path "*/.vs/*" > files.txt

          if [ ! -s files.txt ]; then
            echo "No C++ files found to format"
            exit 0
          fi

          echo "Checking formatting for:"
          cat files.txt

          clang-format-14 --dry-run --Werror $(cat files.txt)
